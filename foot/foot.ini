# ============================================================
# INK · foot
# Terminal casi monocromo: negro tinta / blanco papel.
# ============================================================

[main]
term=xterm-256color
# Nombre de fuente estándar de DejaVu Sans Mono / Nerd Font
font=DejaVu Sans Mono:size=11
font-bold=DejaVu Sans Mono:style=Bold:size=11
font-italic=DejaVu Sans Mono:style=Oblique:size=11
pad=16x12
dpi-aware=no
initial-window-size-chars=100x28

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}

[colors-dark]
background=0a0a0a
foreground=eaeaea
selection-foreground=0a0a0a
selection-background=eaeaea

cursor=0a0a0a eaeaea

regular0=1c1c1c
regular1=8a5a5a
regular2=6f7d63
regular3=a08a5a
regular4=6b7a8f
regular5=8a748f
regular6=6e8a8a
regular7=cfcfcf

bright0=4a4a4a
bright1=b07a7a
bright2=93a384
bright3=c7ac78
bright4=8ea0b8
bright5=ac93b8
bright6=93b3b3
bright7=f5f5f5

jump-labels=1c1c1c eaeaea
scrollback-indicator=1c1c1c cfcfcf
search-box-no-match=eaeaea 8a5a5a
search-box-match=0a0a0a a08a5a
urls=cfcfcf

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
